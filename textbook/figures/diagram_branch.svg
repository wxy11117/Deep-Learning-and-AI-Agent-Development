><g transform="translate(136.5, 63)" data-id="a" data-node="true" id="flowchart-a-31" class="node default value flowchart-label"><rect height="49" width="69" y="-24.5" x="-34.5" ry="0" rx="0" style="" class="basic label-container"></rect><g transform="translate(0, -17)" style="" class="label"><rect></rect><text style=""><tspan class="row" x="0" dy="1em" xml:space="preserve">a = wx</tspan><tspan class="row" x="0" dy="1em" xml:space="preserve">a = 2</tspan></text></g></g><g transform="translate(247.5, 24.5)" data-id="square" data-node="true" id="flowchart-square-33" class="node default value flowchart-label"><rect height="49" width="69" y="-24.5" x="-34.5" ry="0" rx="0" style="" class="basic label-container"></rect><g transform="translate(0, -17)" style="" class="label"><rect></rect><text style=""><tspan class="row" x="0" dy="1em" xml:space="preserve">u = a²</tspan><tspan class="row" x="0" dy="1em" xml:space="preserve">u = 4</tspan></text></g></g><g transform="translate(247.5, 101.5)" data-id="linear" data-node="true" id="flowchart-linear-35" class="node default value flowchart-label"><rect height="49" width="69" y="-24.5" x="-34.5" ry="0" rx="0" style="" class="basic label-container"></rect><g transform="translate(0, -17)" style="" class="label"><rect></rect><text style=""><tspan class="row" x="0" dy="1em" xml:space="preserve">v = 3a</tspan><tspan class="row" x="0" dy="1em" xml:space="preserve">v = 6</tspan></text></g></g><g transform="translate(372, 63)" data-id="total" data-node="true" id="flowchart-total-37" class="node default value flowchart-label"><rect height="49" width="96" y="-24.5" x="-48" ry="0" rx="0" style="" class="basic label-container"></rect><g transform="translate(0, -17)" style="" class="label"><rect></rect><text style=""><tspan class="row" x="0" dy="1em" xml:space="preserve">L = u + v</tspan><tspan class="row" x="0" dy="1em" xml:space="preserve">L = 10</tspan></text></g></g><g transform="translate(578, 63)" data-id="grad" data-node="true" id="flowchart-grad-41" class="node default gradient flowchart-label"><rect height="49" width="96" y="-24.5" x="-48" ry="0" rx="0" style="" class="basic label-container"></rect><g transform="translate(0, -17)" style="" class="label"><rect></rect><text style=""><tspan class="row" x="0" dy="1em" xml:space="preserve">∂L/∂a</tspan><tspan class="row" x="0" dy="1em" xml:space="preserve">4 + 3 = 7</tspan></text></g></g><g transform="translate(759.5, 63)" data-id="result" data-node="true" id="flowchart-result-43" class="node default gradient flowchart-label"><rect height="49" width="113" y="-24.5" x="-56.5" ry="0" rx="0" style="" class="basic label-container"></rect><g transform="translate(0, -17)" style="" class="label"><rect></rect><text style=""><tspan class="row" x="0" dy="1em" xml:space="preserve">∂L/∂w</tspan><tspan class="row" x="0" dy="1em" xml:space="preserve">7 × 2 = 14</tspan></text></g></g></g></g></g></svg>