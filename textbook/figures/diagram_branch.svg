anch .edgeLabel rect{opacity:0.5;background-color:#e8e8e8;fill:#e8e8e8;}#diagram_branch .labelBkg{background-color:rgba(232, 232, 232, 0.5);}#diagram_branch .cluster rect{fill:#ffffde;stroke:#aaaa33;stroke-width:1px;}#diagram_branch .cluster text{fill:#333;}#diagram_branch .cluster span,#diagram_branch p{color:#333;}#diagram_branch div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:SimSun,serif;font-size:12px;background:hsl(80, 100%, 96.2745098039%);border:1px solid #aaaa33;border-radius:2px;pointer-events:none;z-index:100;}#diagram_branch .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#333;}#diagram_branch :root{--mermaid-font-family:SimSun,serif;}#diagram_branch .value rect{fill:#dbeafe!important;stroke:#2563eb!important;color:#1e3a5f!important;}#diagram_branch .value polygon{fill:#dbeafe!important;stroke:#2563eb!important;color:#1e3a5f!important;}#diagram_branch .value ellipse{fill:#dbeafe!important;stroke:#2563eb!important;color:#1e3a5f!important;}#diagram_branch .value circle{fill:#dbeafe!important;stroke:#2563eb!important;color:#1e3a5f!important;}#diagram_branch .value path{fill:#dbeafe!important;stroke:#2563eb!important;color:#1e3a5f!important;}#diagram_branch .value tspan{fill:#1e3a5f!important;}#diagram_branch .gradient rect{fill:#fef9c3!important;stroke:#ca8a04!important;color:#713f12!important;}#diagram_branch .gradient polygon{fill:#fef9c3!important;stroke:#ca8a04!important;color:#713f12!important;}#diagram_branch .gradient ellipse{fill:#fef9c3!important;stroke:#ca8a04!important;color:#713f12!important;}#diagram_branch .gradient circle{fill:#fef9c3!important;stroke:#ca8a04!important;color:#713f12!important;}#diagram_branch .gradient path{fill:#fef9c3!important;stroke:#ca8a04!important;color:#713f12!important;}#diagram_branch .gradient tspan{fill:#713f12!important;}</style><g><marker orient="auto" markerHeight="12" markerWidth="12" markerUnits="userSpaceOnUse" refY="5" refX="6" viewBox="0 0 10 10" cl