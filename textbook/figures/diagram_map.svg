lor:rgba(232, 232, 232, 0.5);}#diagram_map .cluster rect{fill:#ffffde;stroke:#aaaa33;stroke-width:1px;}#diagram_map .cluster text{fill:#333;}#diagram_map .cluster span,#diagram_map p{color:#333;}#diagram_map div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:SimSun,serif;font-size:12px;background:hsl(80, 100%, 96.2745098039%);border:1px solid #aaaa33;border-radius:2px;pointer-events:none;z-index:100;}#diagram_map .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#333;}#diagram_map :root{--mermaid-font-family:SimSun,serif;}#diagram_map .main rect{fill:#dbeafe!important;stroke:#2563eb!important;color:#1e3a5f!important;}#diagram_map .main polygon{fill:#dbeafe!important;stroke:#2563eb!important;color:#1e3a5f!important;}#diagram_map .main ellipse{fill:#dbeafe!important;stroke:#2563eb!important;color:#1e3a5f!important;}#diagram_map .main circle{fill:#dbeafe!important;stroke:#2563eb!important;color:#1e3a5f!important;}#diagram_map .main path{fill:#dbeafe!important;stroke:#2563eb!important;color:#1e3a5f!important;}#diagram_map .main tspan{fill:#1e3a5f!important;}#diagram_map .info rect{fill:#f3f4f6!important;stroke:#6b7280!important;color:#1f2937!important;}#diagram_map .info polygon{fill:#f3f4f6!important;stroke:#6b7280!important;color:#1f2937!important;}#diagram_map .info ellipse{fill:#f3f4f6!important;stroke:#6b7280!important;color:#1f2937!important;}#diagram_map .info circle{fill:#f3f4f6!important;stroke:#6b7280!important;color:#1f2937!important;}#diagram_map .info path{fill:#f3f4f6!important;stroke:#6b7280!important;color:#1f2937!important;}#diagram_map .info tspan{fill:#1f2937!important;}</style><g><marker orient="auto" markerHeight="12" markerWidth="12" markerUnits="userSpaceOnUse" refY="5" refX="6" viewBox="0 0 10 10" class="marker flowchart" id="diagram_map_flowchart-pointEnd"><path style="stroke-width: 1; stroke-dasharray: 1, 0;" class="arrowMarkerPath" d="M 0 0 L 10 5 L 0 10 z"></path></marker><marker orient="au