<svg aria-labelledby="chart-title-diagram_train" aria-describedby="chart-desc-diagram_train" aria-roledescription="flowchart-v2" role="graphics-document document" viewBox="-8 -8 838 89.25" style="max-width: none;" xmlns="http://www.w3.org/2000/svg" width="838" id="diagram_train" height="89.25"><title id="chart-title-diagram_train">Training And Model Selection</title><desc id="chart-desc-diagram_train">训练数据产生损失与梯度以更新参数，验证集用于选择检查点，冻结后的模型才进入测试评估。</desc><style>#diagram_train{font-family:SimSun,serif;font-size:17px;fill:#333;}#diagram_train .error-icon{fill:#552222;}#diagram_train .error-text{fill:#552222;stroke:#552222;}#diagram_train .edge-thickness-normal{stroke-width:2px;}#diagram_train .edge-thickness-thick{stroke-width:3.5px;}#diagram_train .edge-pattern-solid{stroke-dasharray:0;}#diagram_train .edge-pattern-dashed{stroke-dasharray:3;}#diagram_train .edge-pattern-dotted{stroke-dasharray:2;}#diagram_train .marker{fill:#333333;stroke:#333333;}#diagram_train .marker.cross{stroke:#333333;}#diagram_train svg{font-family:SimSun,serif;font-size:17px;}#diagram_train .label{font-family:SimSun,serif;color:#333;}#diagram_train .cluster-label text{fill:#333;}#diagram_train .cluster-label span,#diagram_train p{color:#333;}#diagram_train .label text,#diagram_train span,#diagram_train p{fill:#333;color:#333;}#diagram_train .node rect,#diagram_train .node circle,#diagram_train .node ellipse,#diagram_train .node polygon,#diagram_train .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#diagram_train .flowchart-label text{text-anchor:middle;}#diagram_train .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#diagram_train .node .label{text-align:center;}#diagram_train .node.clickable{cursor:pointer;}#diagram_train .arrowheadPath{fill:#333333;}#diagram_train .edgePath .path{stroke:#333333;stroke-width:2.0px;}#diagram_train .flowchart-link{stroke:#333333;fill:none;}#diagram_train .edgeLabel{background-color:#e8e8e8;text-align:center;}#diagram_train .edgeLabel rect{opacity: